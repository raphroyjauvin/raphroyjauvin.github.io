    <text x="455" y="171">common formats,</text>
    <text x="455" y="184">fields + coordinates</text>
    <text x="610" y="171">filter, repair +</text>
    <text x="610" y="184">deduplicate records</text>
    <text x="765" y="171">match each property</text>
    <text x="765" y="184">to its infrastructure</text>
  </g>

