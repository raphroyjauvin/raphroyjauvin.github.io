<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Municipal data preparation engine</title>
  <desc id="d">Transit-map style system diagram: six municipal open datasets flow past a refresh guard into an eight-stage automated pipeline — ingest, standardize, clean, connect, generate, condition, verify, package — and fan out as four verified product lines to hydraulic modeling, risk analytics, backend and API, and web delivery.</desc>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#16283C" fill-opacity="0.055"></circle>
    </pattern>
  </defs>

  <rect width="1000" height="640" fill="#FDFDFB"></rect>
  <rect x="19" y="19" width="962" height="602" fill="url(#dots)"></rect>
  <rect x="18.5" y="18.5" width="963" height="603" fill="none" stroke="#E2E7EB" stroke-width="1"></rect>

  <text x="48" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#16283C">Municipal data preparation engine</text>
  <text x="48" y="88" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8B96A0">one automated run: open data in, model-ready products out</text>
  <text x="952" y="66" text-anchor="end" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10.5" fill="#8B96A0">PyQGIS · cache-aware · fail-fast</text>

  <text x="48" y="128" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#4E5D6C">City open data portal</text>
