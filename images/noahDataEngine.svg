  <circle cx="605" cy="504" r="7.5" fill="#FDFDFB" stroke="#6B4E71" stroke-width="3.5"></circle>
  <circle cx="790" cy="504" r="7.5" fill="#FDFDFB" stroke="#1D7A68" stroke-width="3.5"></circle>
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#16283C" text-anchor="middle">
    <text x="235" y="532">Hydraulic modeling</text>
    <text x="420" y="532">Risk analytics</text>
    <text x="605" y="532">Backend + API</text>
    <text x="790" y="532">Web delivery</text>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="10.5" fill="#8B96A0" text-anchor="middle">
