    <text x="545" y="285">Condition</text>
    <text x="390" y="285">Verify</text>
    <text x="235" y="285">Package</text>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#8B96A0" text-anchor="middle">
    <text x="700" y="303">create missing network</text>
    <text x="700" y="316">links from codified rules</text>
    <text x="545" y="303">shape geometry to</text>
    <text x="545" y="316">simulation standards</text>
    <text x="390" y="303">every output checked</text>
    <text x="390" y="316" fill="#B4432A">by an independent audit</text>
    <text x="235" y="303">versioned, model-ready</text>
    <text x="235" y="316">deliverables</text>
  </g>

