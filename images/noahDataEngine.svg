  <text x="258" y="230" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#B4432A">refresh guard</text>
  <text x="258" y="243" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" fill="#8B96A0">blocks suspicious updates</text>

  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#16283C" text-anchor="middle">
    <text x="300" y="153">Ingest</text>
    <text x="455" y="153">Standardize</text>
    <text x="610" y="153">Clean</text>
    <text x="765" y="153">Connect</text>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#8B96A0" text-anchor="middle">
