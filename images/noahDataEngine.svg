    <text x="124" y="196">Buildings</text>
    <text x="124" y="218">Boundary</text>
    <text x="124" y="240">Network nodes</text>
    <text x="124" y="262">Network segments</text>
  </g>
  <g fill="#9AA5AE">
    <rect x="129" y="145.5" width="5" height="5"></rect>
    <rect x="129" y="167.5" width="5" height="5"></rect>
